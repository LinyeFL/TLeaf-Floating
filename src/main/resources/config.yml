# TLeaf-Floating 悬浮标题 配置

# 默认颜色（十六进制，不带 # 前导的空格问题：需要带 #）
default-color: '#FFFFFF'

# 文字大小（缩放倍数，1.0 为默认）
text-scale: 1.0

# 文字在讲台上方的高度（格）
y-offset: 0.6

# 是否显示阴影
shadowed: true

# 闪烁：呼吸灯，每多少 tick 刷新一次亮度（1 = 每 tick 刷新，最顺滑）
blink-interval: 1

# 闪烁：呼吸频率（每秒完整呼吸几次，1.0 = 1 秒一个明暗来回）
blink-speed: 1.0

# 辉光：光晕层缩放倍数（相对 text-scale，1.15 ≈ 文字外圈一圈光晕）
glow-scale: 1.15

# 辉光：光晕颜色（十六进制，默认白）
glow-color: '#FFFFFF'

# 炫彩模式：色环每秒转几圈（0.3 ≈ 3 秒转完一整圈，柔和不跳变）
rainbow-speed: 0.3

# 炫彩模式：每多少个 tick 刷新一次颜色（1 = 每 tick 刷新，最顺滑）
rainbow-interval: 1

# 扔物品检测的射线距离（格，玩家准星对着讲台扔物品）
# 说明：这是射线长度，从玩家眼睛沿准星向前扫的格数，撞到讲台即命中。
# 不含讲台那一格，也不含玩家站的格子，只算中间空档。2 = 贴脸操作
ray-distance: 2