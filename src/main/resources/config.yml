# TLeaf-Floating 讲台悬浮书名插件配置

# 默认文字颜色（无染料时的颜色），白色
default-color: '#FFFFFF'

# 文字大小（缩放倍数，1.0 为默认）
text-scale: 1.0

# 文字在讲台上方的高度（格）
y-offset: 0.3

# 是否显示阴影
shadowed: true

# 闪烁间隔（tick，20 tick = 1 秒）
blink-interval: 10

# 炫彩模式：色环每秒转几圈（1.0 = 一秒转完一整圈彩虹）
rainbow-speed: 1.0

# 炫彩模式：每多少个 tick 刷新一次颜色（2 = 每 2 tick 刷新，25ms 一帧依然丝滑，负载减半）
rainbow-interval: 2

# 发光模式：光晕层缩放倍数（从内到外，相对文字缩放，1.0 = 与主字一样大）
# 写几个数字就是几层，默认 3 层
glow-scales: [1.05, 1.10, 1.16]

# 发光模式：光晕层文字不透明度（0-255，主字固定 250）
glow-opacity: 150

# 发光模式：光晕颜色混合白色比例（0-1，0.25 = 混 25% 白，更有霓虹感）
glow-white-mix: 0.25

# 呼吸灯：开启后发光时亮度平滑脉动（亮→暗→亮）
breathing-enabled: true

# 呼吸灯：一次完整脉动的秒数（3.0 = 3 秒一轮亮暗）
breathing-period: 3.0

# 呼吸灯：脉动时最暗/最亮的不透明度（0-255）
breathing-min-opacity: 60
breathing-max-opacity: 210

# 呼吸灯：每多少 tick 刷新一次（3 = 每 3 tick 刷新，75ms 一帧人眼无感，负载降到 1/3）
breathing-interval: 3

# 扔物品检测的射线距离（格，玩家准星对着讲台扔物品）
# 说明：这是射线长度，从玩家眼睛沿准星向前扫的格数，撞到讲台即命中。
# 不含讲台那一格，也不含玩家站的格子，只算中间空档。2 = 贴脸操作
ray-distance: 2