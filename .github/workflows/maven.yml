name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Upload a Build Artifact - TLeaf-Floating
        uses: actions/upload-artifact@v4
        with:
          name: "TLeaf-Floating.jar"
          path: 'target/TLeaf-Floating-*.jar'